<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<div style="display:flex;flex-direction:column;gap:18px;max-width:1400px;">
  <div style="display:flex;align-items:center;justify-content:space-between;">
    <div>
      <div style="font-size:22px;font-weight:700;letter-spacing:-.01em;">Students</div>
      <div style="font-size:13.5px;color:var(--mutedFg);margin-top:3px;">Track student journeys from application to arrival</div>
    </div>
    <button style="height:34px;padding:0 16px;border-radius:8px;border:none;background:var(--primary);color:var(--primaryFg);font-size:13px;font-weight:600;cursor:pointer;">+ Add Student</button>
  </div>

  <div style="background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;">
    <div style="display:grid;grid-template-columns:1.4fr 0.9fr 1.6fr 1.2fr 1.1fr 1.1fr;padding:10px 18px;border-bottom:1px solid var(--border);background:var(--muted);">
      <span style="{{ headStyle }}">Name</span><span style="{{ headStyle }}">Country</span><span style="{{ headStyle }}">University</span><span style="{{ headStyle }}">Stage</span><span style="{{ headStyle }}">Counselor</span><span style="{{ headStyle }}">Fees</span>
    </div>
    <sc-for list="{{ students }}" as="s" hint-placeholder-count="5">
      <div onclick="{{ s.onClick }}" style="display:grid;grid-template-columns:1.4fr 0.9fr 1.6fr 1.2fr 1.1fr 1.1fr;padding:12px 18px;border-bottom:1px solid var(--border);align-items:center;cursor:pointer;">
        <span style="font-size:13px;font-weight:600;color:var(--primary);">{{ s.name }}</span>
        <span style="font-size:12.5px;color:var(--mutedFg);">{{ s.country }}</span>
        <span style="font-size:12.5px;">{{ s.university }}</span>
        <span><span style="font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--muted);">{{ s.stage }}</span></span>
        <span style="font-size:12.5px;color:var(--mutedFg);">{{ s.counselor }}</span>
        <span><span style="font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:{{ s.feesBg }};color:{{ s.feesFg }};">{{ s.fees }}</span></span>
      </div>
    </sc-for>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>

const STUDENTS = [
  { id: 's1', name: 'Divya Menon', country: 'Canada', university: 'University of Toronto', stage: 'Visa Filed', counselor: 'Rina Verma', fees: 'Partially Paid' },
  { id: 's2', name: 'Arjun Rao', country: 'UK', university: 'Coventry University', stage: 'Offer Received', counselor: 'Sameer Joshi', fees: 'Fully Paid' },
  { id: 's3', name: 'Neha Gupta', country: 'Australia', university: 'Deakin University', stage: 'Application Submitted', counselor: 'Anil Kumar', fees: 'Dues Pending' },
  { id: 's4', name: 'Karan Chopra', country: 'Germany', university: 'TU Munich', stage: 'Visa Approved', counselor: 'Rina Verma', fees: 'Fully Paid' },
  { id: 's5', name: 'Meera Pillai', country: 'Ireland', university: 'Trinity College Dublin', stage: 'Departed', counselor: 'Sameer Joshi', fees: 'Fully Paid' },
];

const FEES_COLORS = {
  'Fully Paid': ['var(--success)', '#ffffff'],
  'Partially Paid': ['var(--warning)', '#ffffff'],
  'Dues Pending': ['var(--destructive)', 'var(--destructiveFg)'],
};

class Component extends DCLogic {
  renderVals() {
    const selectStudent = this.props.selectStudent || (() => {});
    const students = STUDENTS.map((s) => {
      const [bg, fg] = FEES_COLORS[s.fees];
      return { ...s, feesBg: bg, feesFg: fg, onClick: () => selectStudent(s.id) };
    });
    return {
      headStyle: 'font-size:11px;font-weight:600;color:var(--mutedFg);text-transform:uppercase;letter-spacing:.03em;',
      students,
    };
  }
}

</script>
</body>
</html>
